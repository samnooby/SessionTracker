name: Build

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write        # lets the test-report step publish per-test results as a check
  pull-requests: write # and annotate the PR with any failures

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle 9 needs JDK 17+ to run; build.gradle still targets Java 11 bytecode.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      # Per-test results in the run summary and as a "Test results" check, even when the build fails.
      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: build/test-results/test/*.xml
          check_name: Test results
          detailed_summary: true
          include_passed: true

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
